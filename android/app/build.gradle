plugins { id 'com.android.application' }
android {
  namespace 'com.spikelegends.game'
  compileSdk 34
  defaultConfig {
    applicationId 'com.spikelegends.game'
    minSdk 24
    targetSdk 34
    versionCode (System.getenv('VERSION_CODE') ?: '33') as int
    versionName (System.getenv('VERSION_NAME') ?: '33')
  }
  signingConfigs {
    release {
      storeFile file('../spikelegends.keystore')
      storePassword 'spikelegends'
      keyAlias 'spikelegends'
      keyPassword 'spikelegends'
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.release }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  androidResources { noCompress 'html', 'js', 'mp3' }
  lint { checkReleaseBuilds false; abortOnError false }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
