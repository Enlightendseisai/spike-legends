name: Build Android APK
on:
  push:
    branches: [main, master]
    paths: ['index.html', 'android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build signed APK (log kept for the release notes)
        id: build
        continue-on-error: true
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          set -o pipefail
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/index.html
          cp -r icons android/app/src/main/assets/www/ || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android && gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../SpikeLegends.apk
      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f SpikeLegends.apk ]; then STATUS="✅ Built from commit ${GITHUB_SHA::7} (run ${{ github.run_number }})."; else STATUS="❌ Build failed (run ${{ github.run_number }}). Last lines of the log:"; fi
          { echo "$STATUS"; echo; echo "Download **SpikeLegends.apk** below and open it on your Android phone (allow installs from your browser or Files app)."; if [ ! -f SpikeLegends.apk ]; then echo; echo '```'; grep -E "error|Error|FAIL|What went wrong|wrong:|> " build.log | tail -n 40; echo '---'; tail -n 40 build.log; echo '```'; fi; } > notes.md
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Spike Legends — Android APK" --notes "building…" --target "$GITHUB_SHA"
          gh release edit apk-latest --notes-file notes.md --title "Spike Legends — Android APK"
          if [ -f SpikeLegends.apk ]; then gh release upload apk-latest SpikeLegends.apk --clobber; fi
